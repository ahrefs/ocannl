name: ci
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  # Sunday and Wednesday, 03:00 UTC. Twice weekly rather than weekly because
  # actions/cache evicts entries not read for 7 days: on an exactly-weekly
  # cadence the Windows opam cache would sit on that boundary and every sweep
  # would pay the cold-switch cost (~74min against ~62min warm). The second run
  # also halves the range to bisect when a sweep goes red, which at ~30 commits
  # a day on master is the dominant triage cost. Runner minutes are free here
  # (public repo), so the extra run is paid for in nothing but calendar noise.
  schedule:
    - cron: "0 3 * * 0,3"
  workflow_dispatch:
    inputs:
      extended:
        description: "Also run the scheduled-only jobs (Windows, OCaml floor)"
        type: boolean
        default: true
# A push superseded by another push to the same ref no longer needs a verdict:
# runs here serialize on a queue that is often hours deep, so without this a
# review round of N pushes creates N queued runs and the head commit -- the only
# one whose verdict anyone will act on -- waits behind N-1 answers to questions
# nobody is still asking (thirteen runs deep on one PR before this landed).
#
# Master pushes are cancellable too, and that is a real trade: at ~30 commits a
# day a superseded merge commit then gets no verdict of its own, so a break is
# localized to a span rather than to a commit. It is still the right side of the
# trade while the queue is hours deep -- what master's HEAD does is the question
# people act on, and `git bisect` over a span is cheaper than a stale answer.
#
# `github.event_name` is in the group so that only like supersedes like. All
# three non-PR triggers share `refs/heads/master` as their ref, and two of them
# must not be cancellable by a routine master push: the scheduled sweep carries
# that period's only Windows and OCaml-floor coverage (the same reasoning as
# `fail-fast: false` below -- cancellation destroys information), and a
# workflow_dispatch run was launched deliberately, usually from a branch, to get
# the extended matrix ahead of the sweep. Scheduled runs cannot overlap each
# other in practice (74min worst case against a 3-day cadence), so grouping
# them is harmless.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    name: Build
    strategy:
      # These jobs are independent diagnostics, not stages, so one failing tells
      # you nothing about the others -- and cancelling them destroys exactly the
      # information you need. Concretely: the ~25min OCaml-floor job going red
      # would cancel the 62-74min Windows job mid-run, losing that sweep's only
      # Windows coverage for three or four days. It has already cost us on the
      # per-PR side, where a macOS failure cancelled ubuntu and left it unclear
      # whether a dependency-solve break was platform-specific.
      fail-fast: false
      matrix:
        # Windows is off the per-PR path: it runs 62-74min against 20min on
        # macOS and 29min on ubuntu, so it set the whole matrix's latency while
        # catching portability breaks that are rare and, when they do happen,
        # are about line endings, float formatting and the mingw toolchain
        # rather than about the change under review. It runs instead on the
        # schedule above, and on demand via workflow_dispatch -- reach for the
        # latter from a branch when touching .expected goldens or the cc
        # backend's toolchain handling, rather than waiting for the sweep.
        #
        # The scheduled and dispatched runs carry ubuntu and macOS too: they are
        # cheap next to Windows, and having them green in the same run is what
        # distinguishes "Windows drifted" from "master is broken".
        #
        # `inputs` is empty (hence falsy) outside workflow_dispatch. The
        # parentheses are load-bearing: && binds tighter than ||, so without
        # them a scheduled run would select the bare boolean `true` and
        # fromJSON would fail on it.
        #
        # Not listed: freebsd. Either the waiting queue for it is very long, or
        # it is not available. (A comment cannot live inside the folded scalar
        # below -- YAML reads anything indented under it as content.)
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || inputs.extended)
          && '["ubuntu-latest", "macos-latest", "windows-latest"]'
          || '["ubuntu-latest", "macos-latest"]') }}
        ocaml-compiler:
          - 5.5.x
        # Which dune targets the job builds. `main` is the regular suite; the
        # `train` shard (added through `include` below) builds only the
        # training-integration tier, which lives off the runtest path because
        # its members serialize on the ocannl_training_test lock and set every
        # full run's wall-clock tail (test/training/dune says why).
        suite:
          - main
        # Two kinds of include entry. The `train` shards: macOS on every run,
        # Windows only on the scheduled/extended matrix beside its main job.
        # macOS ONLY per-PR, deliberately: the tier is a serialized chain
        # (measured ~4.7min on an M4 Max, ~10min on a 24-thread Linux box with
        # the compile cached), so a ubuntu shard would run ~15-20min and
        # replace the ~15min main job as the matrix's latency ceiling, while
        # the macOS shard fits under it -- per-PR execution coverage of the
        # tier on one substrate, at no latency cost. Ubuntu still executes the
        # tier daily through tools/sweep.sh's full-suite units.
        #
        # And the floor the opam files claim: `"ocaml" {>= "5.3.0"}`. Per-PR
        # runs build only 5.5, so without this the lower bound is a promise
        # nothing checks -- and the alternative, raising the constraint to the
        # version we happen to test, would drop users for no technical reason.
        # One extra ubuntu job on the schedule tests the claim instead. It
        # rides the same cadence as Windows because a floor breaks the way
        # Windows does: slowly, through the dependency cone rather than through
        # this repo's code. Its `suite` is spelled out because an include entry
        # that omits a matrix key would otherwise match and EXTEND an existing
        # combination instead of adding a job.
        include: >-
          ${{ fromJSON((github.event_name == 'schedule' || inputs.extended)
          && '[{"os": "ubuntu-latest", "ocaml-compiler": "5.3.x", "suite": "main"},
               {"os": "macos-latest", "ocaml-compiler": "5.5.x", "suite": "train"},
               {"os": "windows-latest", "ocaml-compiler": "5.5.x", "suite": "train"}]'
          || '[{"os": "macos-latest", "ocaml-compiler": "5.5.x", "suite": "train"}]') }}
    runs-on: ${{ matrix.os }}
    # Hard ceilings, not budgets: a hung job otherwise runs to GitHub's six-hour
    # default. The ceiling is fixed when the job starts, before the opam cache
    # step knows whether it hit, so it has to clear a COLD switch, not the
    # designed ~15min: ubuntu has run 29-31min and macOS ~20min on a miss, so
    # 45min means the job hung. Windows is the honest exception: its cold switch
    # and the serialized train tier have run 47-175min on the scheduled matrix,
    # so it gets a ceiling that only a genuine hang can reach. `tools/ci-durations.sh`
    # prints the per-job distribution these have to clear; re-read it before moving them.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 240 || 45 }}
    # No dune shared cache in CI, and explicitly so. Two things rule it out.
    # Dune's `enabled-except-user-rules` mode -- its default, and what this job
    # used to set -- excludes OCaml compilation from the shared cache by
    # construction (module_compilation.ml opts only Melange rules in), so the
    # cache setup-ocaml used to save for us was a ~400-byte empty tar on every
    # platform: the "compilation and linking still cache" premise it was kept
    # under was false, and every run recompiled from scratch anyway. The other
    # mode, `enabled`, caches user rules too, and our test suite is largely
    # user-written rules that run executables whose output depends on runner
    # state dune does not model as a dependency -- the C toolchain the cc
    # backend shells out to, the host ISA that reaches `-march=native`, the
    # core count behind pool-rendered Grid loops. A result recorded on one
    # runner standing in for an execution that never happened on this one is a
    # false green, not a speedup. `disabled` says so rather than leaving the
    # default's silence to be mistaken for a working cache again. A compile-only
    # shared cache that never sees test outputs is a design of its own (two
    # dune walks over two cache roots). Measured for gh-ocannl-901 on 2026-09-04,
    # the compile-only @check/trace step took 23-47s (38s median) across the last
    # eight completed master pushes, against an 18.4min median ubuntu main job:
    # about 3.6%, and an upper bound because that step also executes the trace
    # test. Saving well under a minute before restore/trim/save overhead does not
    # justify making the 12-17min test walk wait for a separate compile phase and
    # forfeiting its scheduling overlap. Re-measure with tools/ci-durations.sh and
    # tools/ci-times.sh before revisiting; until compilation is a large share,
    # keep the cache disabled.
    env:
      DUNE_CACHE: disabled
    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global core.ignorecase false
    # Defender scans every file the cache restore unpacks, every executable dune
    # links, and every kernel .dll the cc backend writes and then dlopens -- the
    # last two happen thousands of times per build. Exclusions must precede the
    # first restore to be worth anything. Best-effort: the runner user is an
    # admin today, but a policy-managed image would refuse, and that is not a
    # reason to fail the build.
    - name: Exclude build directories from Defender (Windows)
      if: runner.os == 'Windows'
      continue-on-error: true
      run: |
        foreach ($path in 'D:\a', 'C:\.opam', $env:TEMP) {
          try { Add-MpPreference -ExclusionPath $path -ErrorAction Stop }
          catch { Write-Host "could not exclude ${path}: $($_.Exception.Message)" }
        }
    # Refresh the apt index: the runner image's package lists go stale, making
    # opam's depext step 404 on superseded package versions.
    - name: Update apt package index
      if: runner.os == 'Linux'
      run: sudo apt-get update
    - uses: actions/checkout@v7
    # Hermetic composite-action coverage belongs on the POSIX runner where the
    # action's bash/sed/awk contract executes natively. It uses fake opam and
    # git binaries, so it needs neither setup-ocaml nor network and adds no
    # matrix-wide dependency-install cost.
    - name: Test pin-revisions action
      if: matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.5.x' && matrix.suite == 'main'
      run: tools/test-pin-revisions.sh
    # These harnesses deliberately sit outside dune. The first two create, stop
    # and kill process groups, and the zombie-only-group fact they guard is
    # decided by the kernel; run the family on Linux, where the bare killpg
    # probe counts a zombie and the shared state-reading ladder must narrow it.
    # test-ci-times.sh spawns nothing, but its subject shells out to `python3`
    # under that exact name, which is not what a python3 is called on every
    # platform `dune runtest` runs on -- so it rides the same POSIX leg rather
    # than a dune alias. All three share the SKIP contract, so a leg this
    # runner cannot decide is a counted skip rather than a red step. Run every
    # one even when one fails, so one regression cannot mask the others'
    # diagnostics.
    - name: Test shell harnesses (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.5.x' && matrix.suite == 'main'
      run: |
        failures=0
        tools/test-test-run.sh || failures=$((failures + 1))
        scripts/test-setup-ocaml-env.sh || failures=$((failures + 1))
        tools/test-ci-times.sh || failures=$((failures + 1))
        exit $((failures > 0 ? 1 : 0))
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ matrix.ocaml-compiler }}
        allow-prerelease-opam: false
    # Fetch package archives from opam.ocaml.org's cache before their upstream
    # URLs. setup-ocaml points opam at the GIT opam-repository, whose `repo` file
    # declares no `archive-mirrors` (the HTTP mirror's does), so a bare switch
    # here downloads every archive from wherever its package's `url` says --
    # and GitLab generates tag archives on demand with no byte-stability
    # promise, so an opam-repository checksum can stop matching what
    # gitlab.inria.fr serves until someone re-pins it (menhir, gh-ocannl-889;
    # exit 40 on every leg that had to fetch). The cache is keyed by checksum,
    # holds every archive opam-repository's CI has verified, and is what the
    # default HTTP repository consults first; a package absent from it still
    # falls through to upstream. The set form (not `+=`) keeps a restored opam
    # root from accumulating duplicates. `shell: bash` because the value is
    # opam syntax and must reach opam with its double quotes intact, which
    # PowerShell's native-command quoting does not guarantee; either bash on the
    # Windows image serves for one opam invocation.
    - name: Route archive fetches through the opam.ocaml.org cache
      shell: bash
      run: opam option 'archive-mirrors="https://opam.ocaml.org/cache"'
    # FIXME: We need to pin printbox-text until > 0.12.0 is released.
    - run: opam pin -n printbox-text https://github.com/c-cube/printbox.git
    # FIXME: pin pcre until a release > 8.0.5: released stubs fail to compile with
    # mingw gcc >= 14 on Windows (incompatible-pointer-types became an error); the
    # fix ("Fixed type cast", 2025-10-20) is unreleased.
    - run: opam pin -n pcre https://github.com/mmottl/pcre-ocaml.git
    - run: opam pin -n .
    # Cache the built dependency switch. `opam install --deps-only` compiles
    # roughly 180 packages from source — 225s on ubuntu, 730s on windows — and
    # opam has no binary packages, so caching the result is the only lever on it.
    # setup-ocaml's own cache covers opam and the bare compiler switch, which is
    # why switch creation is ~70s rather than ten minutes; it does not cover these.
    #
    # The key must follow both the ordinary-package solution and every remote git
    # pin that can move while the project opam files stay byte-identical, or a hit
    # serves stale dependency revisions indefinitely. The action derives both
    # from live solver state, so a new compatible release and a new pin join the
    # key without caller-owned lists -- and leaves the project's own pinned
    # definitions out, since opam records the checkout's git ref in them
    # (`#master` here, `#HEAD` on a pull request's detached checkout), which
    # keyed the cache by event type and made every PR run miss the switch
    # master had just saved (gh-ocannl-889). It carries the rest of the
    # reasoning; `gh-pages-api.yml` calls the same one, keeping the workflows
    # from diverging again (gh-ocannl-732, gh-ocannl-809).
    - name: Resolve opam dependency source revisions
      id: pins
      uses: ./.github/actions/pin-revisions
    - name: Cache opam dependencies
      id: opam-cache
      uses: actions/cache@v6
      with:
        # On Windows the mingw system libraries live in opam's internal cygwin
        # root, outside _opam. Without them a restored switch believes its
        # conf-mingw-w64-* packages are present while their libraries are gone,
        # and linking fails; caching both also carries the pkgconf repair below.
        path: |
          _opam
          ${{ runner.os == 'Windows' && 'C:\.opam\.cygwin' || '' }}
        key: opam-deps-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('*.opam') }}-${{ steps.pins.outputs.solution-digest }}-${{ steps.pins.outputs.digest }}
    # FIXME: cygwin's pkgconf 3.0.4-1 (published 2026-07-26) breaks
    # `pkgconf --personality=<triplet>`, so every conf-mingw-w64-* package (gmp,
    # zlib, openssl, sqlite3, pcre2, curl, libffi) fails its existence check and
    # `opam install` aborts. Two regressions: personality files are only looked up
    # in /usr/lib/pkgconfig/personality.d while the cygwin package installs them
    # to /etc/pkgconfig/personality.d, and even once loaded the personality's
    # DefaultSearchPaths are ignored for module lookup. Setting PKG_CONFIG_PATH
    # would make the checks pass, but then pkgconf emits the cygwin POSIX paths
    # (-I/usr/x86_64-w64-mingw32/sys-root/mingw/include etc.) that the personality
    # exists to elide, and mingw gcc cannot resolve those. So instead: install the
    # system packages, put pkgconf 2.5.1-1 back, and build the opam dependencies
    # with depext handling off so opam does not re-run cygwin's setup.exe (which
    # passes --upgrade-also) and undo the downgrade.
    # Drop these three steps, restoring the plain install below for all platforms,
    # once cygwin ships a fixed pkgconf.
    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows' && steps.opam-cache.outputs.cache-hit != 'true'
      run: opam install . -y --deps-only --with-test --with-doc --depext-only
    - name: Restore cygwin pkgconf 2.5.1 (Windows)
      if: runner.os == 'Windows' && steps.opam-cache.outputs.cache-hit != 'true'
      run: |
        $root = "$(opam var root)\.cygwin\root"
        $base = 'https://cygwin.mirror.constant.com/x86_64/release/pkgconf'
        New-Item -ItemType Directory -Force pkgconf-2.5.1 | Out-Null
        # pkgconf.exe links cygpkgconf-7.dll, so libpkgconf7 has to come along:
        # installing 3.0.4 brought in cygpkgconf-8.dll only, and against that the
        # 2.5.1 binary dies at load time with empty stdout.
        foreach ($pkg in 'pkgconf-2.5.1-1-x86_64', 'libpkgconf7/libpkgconf7-2.5.1-1-x86_64') {
          $file = "$(Split-Path -Leaf $pkg).tar.zst"
          curl.exe -sSLf -o $file "$base/$pkg.tar.zst"
          tar.exe -xf $file -C pkgconf-2.5.1
        }
        # Cygwin mounts /usr/bin at <root>\bin, and nothing reads a physical
        # <root>\usr\bin, so the package payload has to be copied rather than
        # extracted over the root verbatim.
        Copy-Item pkgconf-2.5.1\usr\bin\* "$root\bin" -Force
        # Out-String because -notlike/-notmatch filter string arrays instead of
        # returning a boolean, and --dump-personality prints several lines.
        # 2>&1 so a load-time failure lands in the message instead of showing up
        # as an unexplained empty string.
        $version = (& "$root\bin\pkgconf.exe" --version 2>&1 | Out-String).Trim()
        if ($version -notlike '2.5.1*') {
          throw "expected pkgconf 2.5.1, got '$version' (extraction failed? this needs a tar with zstd support)"
        }
        $personality = (& "$root\bin\pkgconf.exe" --personality=x86_64-w64-mingw32 --dump-personality 2>&1 | Out-String)
        if ($personality -notmatch 'Triplet: x86_64-w64-mingw32') {
          throw "pkgconf still cannot load the mingw personality: $personality"
        }
    - name: Install opam dependencies (Windows)
      if: runner.os == 'Windows' && steps.opam-cache.outputs.cache-hit != 'true'
      run: opam install . -y --deps-only --with-test --with-doc --no-depexts
    # Depexts are SYSTEM packages: they live on the runner, not in the cached
    # `_opam`, so on a cache hit the install step below is skipped and they are
    # simply absent. The restored switch then has the OCaml `curl` bindings while
    # the runner has no libcurl to link against, and `dune build` dies with
    # `/usr/bin/ld: cannot find -lcurl`. That is why ubuntu alternates green and
    # red by cache state rather than by commit. Installing depexts unconditionally
    # is cheap (it compiles no OCaml) and idempotent. Windows is exempt: it caches
    # its cygwin system libraries alongside `_opam`, and re-running depext there
    # would re-run cygwin's setup.exe and undo the pkgconf downgrade above.
    - name: Install system dependencies
      if: runner.os != 'Windows'
      run: opam install . -y --deps-only --with-test --with-doc --depext-only
    - name: Install opam dependencies
      if: runner.os != 'Windows' && steps.opam-cache.outputs.cache-hit != 'true'
      run: opam install . -y --deps-only --with-test --with-doc
    # The archive's cost is dominated by file count, not bytes, and that count is
    # dominated by sources opam has no further use for: it keeps a separate full
    # copy of the dune tree for each of dune's ~17 sub-packages, so a switch
    # measures ~150k files of which ~138k are `.opam-switch/sources` holding
    # ~18% of the bytes. Unpacking 1.28GB of that took 773s on windows against
    # 18s for 715MB on ubuntu. Nothing downstream reads them: the install steps
    # above are the only consumers and they are skipped on a cache hit, which is
    # also why this only needs to run when a save is going to happen (the save
    # itself is actions/cache's post step, at the end of the job).
    - name: Prune sources from the switch before caching
      if: steps.opam-cache.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf _opam/.opam-switch/sources _opam/.opam-switch/build
    - name: Check non-default module log level and trace semantics
      if: matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.5.x' && matrix.suite == 'main'
      env:
        OCANNL_LOG_LEVEL_CC_BACKEND: 3
      run: opam exec -- dune build "@check" "@test/operations/runtest-cc_backend_trace_name"
    # One walk, not `dune build` then `dune runtest`: as two commands, the
    # `(test)` stanzas and inline-test runners only start after every file
    # target -- including the golden-rule test executions `@default` carries and
    # the cheap cc runtime canaries for every bin/ executable in `@bin-smoke`,
    # plus on macOS the exact-iteration Metal queue probe that alias also
    # carries -- has finished, so the serialized `ocannl_training_test` chain
    # runs against an otherwise idle runner. One invocation lets dune schedule
    # that chain concurrently with the rest of the build, overlapping the two
    # phases. A failure still names its rule, so nothing is lost in attribution.
    #
    # One backend only: test/config pins `backend=cc` and nothing here sets
    # OCANNL_BACKEND. multidev_cc needs no hardware and COULD run on these
    # runners, but a second runtest leg under OCANNL_BACKEND=multidev_cc
    # would roughly double the ubuntu job's test time on a queue that
    # is often hours deep, so the decision (gh-ocannl-756) is to gate it with
    # the DAILY local sweep instead: tools/sweep.sh runs a full
    # `OCANNL_BACKEND=multidev_cc dune runtest` unit every day and the sweep
    # routine ages that coverage the way it ages the GPU backends'. If per-PR
    # gating ever becomes worth the latency, prefer a leg scoped to the
    # directories that keep multidev goldens (`grep -rl multidev_cc
    # test/*/dune`) over a full second suite.
    #
    # The aliases are QUOTED for the Windows legs, whose default `run:` shell is
    # PowerShell: unquoted, `@default`/`@runtest`/`@bin-smoke`/`@train` are splatted (empty)
    # variables and the command degrades to a plain `dune build` that compiles
    # everything and runs no tests -- a silent false green. bash and cmd are
    # unaffected.
    - run: opam exec -- dune build ${{ matrix.suite == 'train' && '"@train"' || '"@default" "@runtest" "@bin-smoke"' }}
    # `tools/test-run.sh` carries branches that ONLY execute under MSYS: it
    # sources `tools/opam-env.sh` unconditionally and fatally (a dune on PATH
    # does not imply rewritten cygwin paths there), routes dune through
    # `tools/dune-quiet.sh`, degrades its process-liveness probe to a bare pid
    # where MSYS `ps` lacks the lstart/state columns, and takes the worktree
    # flock through MSYS perl. Nothing on Linux or macOS reaches any of that,
    # and the script is otherwise driven from rare hand-run Windows sessions --
    # so without this step those branches rot invisibly and are discovered by
    # whoever next needs the runner, mid-task.
    #
    # Deliberately built around `tools/promote.sh`: a source file dune merely
    # copies into `_build`, so the step costs a workspace scan rather than a
    # compile. What is under test is the runner's plumbing, not dune's ability
    # to build anything.
    #
    # Runs regardless of whether `dune runtest` above passed (but not after a
    # cancellation): Windows runs twice a week, so letting a golden drift mask
    # the runner's health would cost three days of signal for nothing. It is
    # last so that the converse cannot happen either -- a broken runner must
    # not abort the sweep's only Windows test coverage.
    #
    # Git Bash by absolute path, NOT `shell: bash` (gh-ocannl-662). `shell: bash`
    # resolves whichever bash PATH offers first, and by this point in the job
    # setup-ocaml has prepended opam's cygwin -- so the step ran under a Cygwin
    # bash, where two things went wrong at once. It ships no perl, which carries
    # the flock, the cap and the `last` pointer, so the first command refused
    # with exit 2 (as a phantom lock conflict, until the preflight in that script
    # was taught to say so). And a Cygwin runtime is not what the branches above
    # are: `uname -o` reports Cygwin there, so `opam-env.sh` skips the MSYS path
    # rewrite and `ps` carries the columns whose absence the liveness probe
    # degrades for -- the step would have exercised neither, while its name
    # claimed both. The path is fixed on every windows runner image.
    #
    # `Progra~1`, not `Program Files`, and the YAML quotes do not save it: the
    # runner parses a custom `shell:` by splitting the string at the FIRST space
    # into command and arguments, with no quote handling
    # (ScriptHandlerHelpers.ParseShellOptionString), so the long form selects
    # `C:\Program` as the executable and the step dies before bash starts -- on
    # every Windows run, whatever the build did (Codex P1). The 8.3 alias is the
    # space-free spelling of the same file.
    #
    # `bin\bash.exe`, NOT `usr\bin\bash.exe`: the former is Git's launcher, and
    # it prepends its own `/mingw64/bin:/usr/bin` to whatever PATH it inherits.
    # That is what makes choosing the executable sufficient -- `uname`, `perl`
    # and the rest resolve to Git's copies even though setup-ocaml has put
    # opam's cygwin `bin` on the inherited PATH, verified by launching it with
    # exactly that PATH. The raw `usr\bin\bash.exe` provisions nothing and would
    # need the prefix set by hand.
    # Main suite only: the scheduled Windows `train` shard shares the runner
    # image, so a second smoke there would test the same plumbing twice.
    - name: Smoke tools/test-run.sh (Git Bash)
      if: ${{ !cancelled() && runner.os == 'Windows' && matrix.suite != 'train' }}
      shell: 'C:\Progra~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
      run: |
        # The shell pin above is the whole reason the branches below are the MSYS
        # ones, and a shell declaration is exactly the kind of line a later edit
        # "simplifies" back to `shell: bash`. `uname -o` is what tells the two
        # runtimes apart (both bashes report OSTYPE=cygwin, MSYS2 being a cygwin
        # fork), and it is the same question `tools/opam-env.sh` asks before
        # rewriting paths -- so assert it here rather than discovering from a
        # green step that nothing it names was exercised.
        [ "$(uname -o)" = Msys ] || {
          echo "::error::smoke step must run under Git Bash; uname -o says $(uname -o)"
          exit 1
        }
        expect() { # <expected-exit> <label> <command...>
          local want=$1 label=$2 got=0
          shift 2
          "$@" || got=$?
          if [ "$got" != "$want" ]; then
            echo "::error::test-run.sh $label exited $got, expected $want"
            exit 1
          fi
        }
        # Attached run, then the one-shot verdict read. `status` exits 0 for any
        # FINISHED run (3 still running, 1 died without a verdict), so its 0
        # asserts that a verdict was published -- `run`'s 0 is what asserts the
        # build was green.
        expect 0 'run' tools/test-run.sh run --cap 300 build tools/promote.sh
        expect 0 'status last' tools/test-run.sh status last
        # A failing dune must still surface as dune's own 1. On Windows that
        # status travels through dune-quiet.sh's stderr filter, where a dropped
        # PIPESTATUS would report every red run as green -- the one failure this
        # whole file exists to prevent. Exactly 1, not merely nonzero: the
        # script's own refusals (usage, lock, unrewritten toolchain) exit 2 and
        # the cap exits 142, and neither may pass for a build failure.
        expect 1 'run (failing target)' \
          tools/test-run.sh run --cap 300 build @no-such-alias-smoke
        # Detached mode: `start` publishes pointers and returns immediately,
        # `wait` polls the verdict FILE under its own bound (the run's cap plus
        # slack) and exits with dune's status. Both rest on the liveness probes
        # that degrade on MSYS, and on the `last` pointer -- which is a plain
        # file precisely because MSYS `ln -s` copies instead of linking.
        # `list` walks every recorded run through the same probes plus the
        # retention scan.
        expect 0 'start' tools/test-run.sh start --cap 300 build tools/promote.sh
        expect 0 'wait last' tools/test-run.sh wait last
        expect 0 'list' tools/test-run.sh list
        # Not covered: the second-launch lock refusal (exit 2), which needs a
        # run still holding the lock when the second arrives -- i.e. minutes of
        # real build, against a step meant to cost seconds.

  # Formatting is a gate here, and a job of its own rather than a step of the
  # build: `dune build @fmt` compiles nothing, so this switch holds only the
  # compiler and ocamlformat and answers in minutes while the build matrix is
  # still queued -- a formatting red should be the FIRST thing a PR hears, not
  # something found after twenty minutes of compilation. `lint-fmt` reads the
  # ocamlformat release from `.ocamlformat` and installs exactly that, which is
  # the same pin `dune-project`'s with-dev-setup dependency installs locally, so
  # the two cannot disagree about what "formatted" means. No opam pins and no
  # depexts: neither the project's opam files nor their dependencies are needed
  # to format the tree. (Formatting used to be an off-branch daily sweep; the
  # gate replaced it -- gh-ocannl-938 -- because a repo-wide reformat commit
  # conflicts with every branch in flight, while on the author's branch it costs
  # one command. AGENTS.md says when to run it.)
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.x
        allow-prerelease-opam: false
        opam-pin: false
        opam-depext: false
    - uses: ocaml/setup-ocaml/lint-fmt@v3

  # A red on master is nobody's to sit and watch: merging sessions do not poll
  # CI after landing (roll-forward, ahrefs/ocannl#861). Instead this job fires
  # the "ocannl-staging CI-red triage" Claude Code routine, which claims the
  # failure with an issue on ahrefs/ocannl -- issues are disabled on this
  # repository, and that is where the issues live anyway -- and then either
  # opens a ci-fix/* PR here or posts its diagnosis to the claiming issue.
  # Scheduled sweeps are included on purpose -- their reds (Windows, OCaml
  # floor) are master reds that no merge event announces. PR runs are excluded:
  # the PR's own session watches those. Until the ROUTINE_FIRE_URL and
  # ROUTINE_FIRE_TOKEN secrets are set this job is a logged no-op, and a failed
  # fire is soft (the routine's daily backstop sweep catches what a lost
  # notification misses; a second red job here would only muddy an already-red
  # run).
  notify-triage-routine:
    name: Fire CI-red triage routine
    needs: [run, fmt]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_FIRE_TOKEN" ]; then
            echo "ROUTINE_FIRE_URL/ROUTINE_FIRE_TOKEN not configured; skipping."
            exit 0
          fi
          # Both non-default curl options exist to keep a failed fire from
          # masquerading as a successful one. --fail-with-body: without it curl
          # exits 0 on an HTTP 4xx/5xx, so a revoked token (generating a new one
          # revokes the old), a changed beta header on this experimental
          # endpoint, or a 429 would be logged as a fire that happened, and the
          # soft-failure line below would never print; the body still reaches
          # the log, which is where the error type and message are. --max-time:
          # the endpoint returns as soon as the session is created, so seconds
          # is the honest scale -- but one that accepts the connection and then
          # stalls would otherwise hold this job to GitHub's job-level limit,
          # delaying completion of every red master run rather than taking the
          # soft-failure path.
          curl -sS --fail-with-body --max-time 30 -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"CI failed on master: workflow=$GITHUB_WORKFLOW event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            || echo "fire request failed (rc=$?); the routine's daily sweep will catch this red."
