name: github pages api

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "test/**"
  push:
    branches:
      - master  # Set a branch name to trigger deployment
    paths-ignore:
      - "docs/**"
      - "test/**"

# Pushes queue per workflow (gh-ocannl-1546): one run at a time, and a newer
# push replaces a pending one -- each run builds the whole API at its commit,
# so the newer one publishes a superset. Only the short `publish` job joins
# `gh-pages-deploy`, the queue shared with gh-pages-docs.yml, which keeps
# every publish so the two workflows' pushes to the gh-pages branch never race
# (gh-ocannl-825) and neither drops the other's; gh-pages-docs.yml says more.
# Pull-request and manual builds get run-specific groups so validation never
# waits behind a publish.
concurrency:
  group: ${{ github.event_name == 'push' && 'gh-pages-api-build' || format('gh-pages-build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  OCAML_COMPILER: '5.5.0'

jobs:
  build:
    # Avoid Ubuntu 24.04, see: https://github.com/ocaml/opam/issues/5968
    runs-on: ubuntu-22.04
    timeout-minutes: 30 # ~1min normally; a ceiling only a hang can reach
    steps:
      # Refresh the apt index: the runner image's package lists go stale, making
      # opam's depext step 404 on superseded package versions. `ci.yml` carries
      # the same step for the same reason; without it the `Deps` step below dies
      # on `libcurl4-gnutls-dev` 404 and this workflow never publishes (gh-ocannl-698).
      # No `runner.os` guard: `runs-on` above is pinned to ubuntu.
      - name: Update apt package index
        # Capped and retried: ci.yml's matrix-job copy says why (gh-ocannl-1809).
        run: |
          for attempt in 1 2; do
            rc=0
            sudo timeout --kill-after=15 240 apt-get update -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 || rc=$?
            [ "$rc" -eq 0 ] && exit 0
            case $rc in 124|137) last="stalled past 240s (apt mirror stall)" ;; *) last="failed with exit $rc" ;; esac
            echo "::warning title=apt-get update::attempt $attempt of 2 $last"
          done
          echo "::error title=apt-get update::sudo apt-get update did not complete in 2 capped attempts; the last $last. The apt index refresh precedes the change under test: re-run the job."
          exit 1

      - uses: actions/checkout@v7

      # setup-ocaml's apt packages from a cache, as ci.yml does (gh-ocannl-1544,
      # gh-ocannl-1574; the action says how).
      - name: Pre-install setup-ocaml's apt packages
        uses: ./.github/actions/setup-ocaml-debs

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}

      # Archives from opam.ocaml.org's checksum-keyed cache before upstream, as
      # ci.yml does and explains: an on-demand GitLab archive can stop matching
      # its pinned checksum (gh-ocannl-889), and the mirror that covers it is a
      # setup-ocaml repository default rather than a guarantee of ours.
      - name: Route archive fetches through the opam.ocaml.org cache
        run: opam option 'archive-mirrors="https://opam.ocaml.org/cache"'

      - name: Pin
        run: opam pin -n .

      # Resolve only after every pin is registered; the live registry is the
      # source of truth for the cache key in both workflows.
      - name: Resolve opam dependency source revisions
        id: pins
        uses: ./.github/actions/pin-revisions

      # Cache the built local switch, where the ~180 compiled dependencies live.
      # The key covers every input that can make its contents runner-specific or
      # dependency-specific: OS, architecture, exact compiler, all project opam
      # files, the solved ordinary-package definitions, and every resolved pin.
      # Over-invalidating costs one rebuild; under-invalidating silently serves
      # stale code.
      #
      # Deliberately use exact-key restores only. Pin resolution above reads the
      # live `_opam` registry before cache lookup; a broad restore key could then
      # replace it with a switch carrying older pins. An exact hit has the same
      # opam-file, ordinary-solution metadata and resolved-pin identity, so
      # restoring that registry is safe.
      - name: Cache opam dependencies
        id: opam-cache
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ hashFiles('*.opam') }}-${{ steps.pins.outputs.solution-digest }}-${{ steps.pins.outputs.digest }}

      # The depexts from a cache: ci.yml's "List opam's missing system
      # dependencies (Linux)" says how (gh-ocannl-1574). `--with-test --with-doc`,
      # matching the install below (`-ydt`). No `runner.os` guard: ubuntu, as above.
      - name: List opam's missing system dependencies
        id: depexts
        shell: bash
        run: |
          request=$(printf '%s\n' ./*.opam | sed 's#^\./##; s#\.opam$##' | paste -sd, -)
          if ! listed=$(opam --cli=2.1 list --safe --color=never --external \
              --resolve="$request" --with-test --with-doc); then
            echo "::warning::could not list opam's system dependencies; the install below fetches them itself"
            exit 0
          fi
          # Present: an installed package's name, or a name one provides -- opam
          # counts both (22.04's pkgconf provides pkg-config, and installing the
          # real pkg-config there would remove pkgconf).
          if ! present=$(dpkg-query -W -f='${db:Status-Abbrev}|${Package}|${Provides}\n' |
              awk -F'|' 'substr($1, 2, 1) == "i" { print $2; n = split($3, p, ",")
                for (i = 1; i <= n; i++) { sub(/\(.*/, "", p[i]); gsub(/[ \t]/, "", p[i]); print p[i] } }'); then
            echo "::warning::could not list the installed packages; the install below fetches opam's system dependencies itself"
            exit 0
          fi
          present=" $(echo $present) "
          missing=
          for p in $listed; do
            case $present in *" $p "*) ;; *) missing="$missing $p" ;; esac
          done
          echo "opam's system dependencies: $(echo $listed); missing:${missing:- none}"
          echo "packages=${missing# }" >>"$GITHUB_OUTPUT"

      - name: Pre-install opam's system dependencies from a cache
        if: steps.depexts.outputs.packages != ''
        uses: ./.github/actions/apt-debs-cache
        with:
          packages: ${{ steps.depexts.outputs.packages }}
          key: opam-depexts-debs-v1

      # Depexts are system packages: a restored `_opam` records their opam
      # packages, but the fresh runner still lacks the libraries themselves.
      # Keep this unconditional, as ci.yml does, or a hit can restore OCaml curl
      # bindings with no system libcurl to link against.
      - name: Install system dependencies
        run: opam install -ydt . --deps-only --depext-only

      - name: Install opam dependencies
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: opam install -ydt . --deps-only

      # These sources/build trees dominate the archive's file count and are not
      # needed after installation. The cache post-step saves the pruned switch.
      - name: Prune sources from the switch before caching
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: rm -rf _opam/.opam-switch/sources _opam/.opam-switch/build

      - name: Build
        run: opam exec -- dune build @doc

      - name: Hand the site to the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: api-html
          path: _build/default/_doc/_html/
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Shared with gh-pages-docs.yml's publish; see the workflow's concurrency.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-html
          path: api-html/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./api-html/
          destination_dir: dev
          enable_jekyll: true
