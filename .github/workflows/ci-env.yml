name: ci-env
# The clean room: a fresh checkout, a fresh dependency switch solved from the
# opam files alone, and the build an opam user gets (gh-ocannl-1816). This is
# master's per-merge verdict; ci.yml's full matrix gates PR heads and sweeps
# master daily. The fleet's boxes cover the backends and platforms, but they
# share one opam switch, local pins, warm `_build` directories, ignored
# fixtures and caches, so their drift is correlated. What a hosted runner
# proves that they cannot is that the repository builds from what it declares.
#
# Deliberately absent, so the room stays clean: ci.yml's CI-side opam pins
# (printbox-text, pcre -- not in the opam files, so not what a user gets), its
# dependency-switch cache (every run solves and builds the switch fresh), and
# dune's shared cache. Kept: setup-ocaml's own cache of the bare compiler, and
# the apt mitigations ci.yml uses (they fetch system packages, not ours).
on:
  push:
    branches:
      - master
  pull_request:
# ci.yml's rule: a PR push supersedes the run of the push before it, and
# nothing else is cancelled. A master push keys its group on its own commit,
# so every merge gets its own verdict instead of one span verdict per burst;
# ci.yml shares one group across pushes to bound its macOS queue, which this
# ubuntu-only, minutes-long job does not need.
concurrency:
  group: ci-env-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  clean-room:
    name: Clean-room build
    runs-on: ubuntu-latest
    # A cold switch (~180 packages from source), one compile of each module,
    # and one test; the apt steps carry caps of their own inside this.
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
    # setup-ocaml's apt packages from a cache (gh-ocannl-1544; the action
    # says how).
    - name: Pre-install setup-ocaml's apt packages
      uses: ./.github/actions/setup-ocaml-debs
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.x
        allow-prerelease-opam: false
    # The depext install below needs a fresh index. Capped and retried:
    # ci.yml's matrix-job copy says why (gh-ocannl-1809).
    - name: Update apt package index
      run: |
        for attempt in 1 2; do
          rc=0
          sudo timeout --kill-after=15 240 apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 || rc=$?
          [ "$rc" -eq 0 ] && exit 0
          case $rc in 124|137) last="stalled past 240s (apt mirror stall)" ;; *) last="failed with exit $rc" ;; esac
          echo "::warning title=apt-get update::attempt $attempt of 2 $last"
        done
        echo "::error title=apt-get update::sudo apt-get update did not complete in 2 capped attempts; the last $last. The apt index refresh precedes the change under test: re-run the job."
        exit 1
    # ci.yml's step of the same name says why (gh-ocannl-889).
    - name: Route archive fetches through the opam.ocaml.org cache
      run: opam option 'archive-mirrors="https://opam.ocaml.org/cache"'
    # Pinning the checkout's own packages is what makes opam honour their
    # `pin-depends`, which are part of what the repository declares.
    - name: Pin the checkout's packages
      run: opam pin -n .
    # The depexts the install below would fetch, from a cache: ci.yml's "List
    # opam's missing system dependencies (Linux)" says how (gh-ocannl-1574).
    # An apt mitigation, so kept (above). `--with-test` alone, as the install.
    - name: List opam's missing system dependencies
      id: depexts
      run: |
        request=$(printf '%s\n' ./*.opam | sed 's#^\./##; s#\.opam$##' | paste -sd, -)
        if ! listed=$(opam --cli=2.1 list --safe --color=never --external \
            --resolve="$request" --with-test); then
          echo "::warning::could not list opam's system dependencies; the install below fetches them itself"
          exit 0
        fi
        # Present: an installed package's name, or a name one provides -- opam
        # counts both (22.04's pkgconf provides pkg-config, and installing the
        # real pkg-config there would remove pkgconf).
        if ! present=$(dpkg-query -W -f='${db:Status-Abbrev}|${Package}|${Provides}\n' |
            awk -F'|' 'substr($1, 2, 1) == "i" { print $2; n = split($3, p, ",")
              for (i = 1; i <= n; i++) { sub(/\(.*/, "", p[i]); gsub(/[ \t]/, "", p[i]); print p[i] } }'); then
          echo "::warning::could not list the installed packages; the install below fetches opam's system dependencies itself"
          exit 0
        fi
        present=" $(echo $present) "
        missing=
        for p in $listed; do
          case $present in *" $p "*) ;; *) missing="$missing $p" ;; esac
        done
        echo "opam's system dependencies: $(echo $listed); missing:${missing:- none}"
        echo "packages=${missing# }" >>"$GITHUB_OUTPUT"
    - name: Pre-install opam's system dependencies from a cache
      if: steps.depexts.outputs.packages != ''
      uses: ./.github/actions/apt-debs-cache
      with:
        packages: ${{ steps.depexts.outputs.packages }}
        key: opam-depexts-debs-v1
    - name: Install dependencies from the opam files
      run: opam install . -y --deps-only --with-test
    - name: Release build, as opam builds the packages
      run: opam exec -- dune build -p arrayjit,neural_nets_lib
    # The two steps below stay in the release profile `-p` built in: `--release`
    # is `-p` without the package filter, so the packages' objects are reused
    # and only what lies outside them (tests, bin/, benchmarks, tools) compiles
    # here. The dev profile would recompile every module under its own flags
    # (gh-ocannl-1907). What dev adds -- warnings as errors -- the PR head's
    # ci.yml run gates, in dev.
    - name: Type-check everything
      run: opam exec -- dune build --release @check
    # One tensor graph compiled through the default cc backend, run, and
    # printed against its golden.
    - name: Smoke test
      run: opam exec -- dune build --release @test/operations/runtest-hello_world_dim1x1

  # A merge's red here is a master red: fire the CI-red triage routine as
  # ci.yml's `notify-triage-routine` does (it says why, and why the fire is
  # soft and bounded).
  notify-triage-routine:
    name: Fire CI-red triage routine
    needs: [clean-room]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_FIRE_TOKEN" ]; then
            echo "ROUTINE_FIRE_URL/ROUTINE_FIRE_TOKEN not configured; skipping."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 30 -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"CI failed on master: workflow=$GITHUB_WORKFLOW event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            || echo "fire request failed (rc=$?); the routine's daily sweep will catch this red."
