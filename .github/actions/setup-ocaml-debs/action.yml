name: Pre-install setup-ocaml's apt packages from a cache
description: >-
  Install the Ubuntu packages ocaml/setup-ocaml installs for itself, from .deb
  files kept in actions/cache, so the action's own `apt-get install` finds
  nothing left to fetch. Linux only; best-effort.

# Why (gh-ocannl-1544): on Linux, setup-ocaml's "Initialising opam state" group
# runs `sudo apt-get --yes install bubblewrap musl-tools rsync` plus whichever
# of darcs, g++-multilib, gcc-multilib and mercurial `apt-cache show` finds
# (setup-ocaml v3.9.0, src/system-packages.ts). On the ubuntu-24.04 image that
# is 29 new packages, 23.6 MB, nearly all of it the lib32/libx32 halves of
# gcc-multilib, fetched from the runner's default mirror,
# azure.archive.ubuntu.com. That mirror served it in 1s on some runs and at
# 39-46 kB/s on others -- 8.5-10 minutes -- while the same runner's other apt
# fetches, minutes apart, ran at MB/s. It was the whole of setup-ocaml's time
# variance (2.4 against 9.5 minutes on the two main shards of run 39793421920,
# up to 11 minutes on the Formatting and Dune-floor jobs, which build nothing),
# and on 2026-10-22 it put one main shard at 37.5 minutes. The opam caches
# were hits throughout; opam played no part.
#
# The cache mechanics are `apt-debs-cache`'s, which says how the key works.
# setup-ocaml itself is the fallback: its own install of the same list runs
# next and fetches whatever this left. The package list restates
# setup-ocaml's. If the action's list changes, the pre-install covers less,
# setup-ocaml installs the rest itself, and only the time comes back: a stale
# list costs speed, never correctness.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/apt-debs-cache
      with:
        packages: bubblewrap musl-tools rsync
        optional-packages: darcs g++-multilib gcc-multilib mercurial
        key: setup-ocaml-debs-v1
