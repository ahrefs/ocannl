name: Pre-install apt packages from a cache
description: >-
  Install a list of Ubuntu packages from .deb files kept in actions/cache, so
  the caller's own `apt-get install` of the same list afterwards finds nothing
  left to fetch. Linux only; best-effort.

# Why (gh-ocannl-1544, gh-ocannl-1546): the runner's default Ubuntu mirror
# (azure.archive.ubuntu.com) serves package files at MB/s on most runs and at
# 39-46 kB/s on some, while the same runner's other apt fetches, minutes apart,
# run at MB/s. On a slow run setup-ocaml's 23.6 MB took 10 minutes, and the
# docs workflow's 180 MB of texlive outlived its job's 30-minute ceiling. Kept
# here, the files come from GitHub's cache at tens of MB/s.
#
# The key is a digest of the exact files apt would fetch (`--print-uris`:
# names, sizes, hashes), so an exact hit needs no save, and an updated package
# -- or a new runner image that already ships it -- changes the key rather than
# serving a file apt would refuse anyway: apt checks every file in the archive
# directory against the index before using it, and fetches whatever does not
# match. That check is also what makes the prefix restore safe: on a changed
# digest the newest entry for the same image is restored, apt takes the files
# that still match and fetches only the rest, files the plan no longer names
# are dropped, and the result is saved under the new key. The image
# (the runner's `ImageOS`) is in the key, so ubuntu-22.04 and ubuntu-24.04 never restore
# each other's files.
#
# The fill is a step of its own with its own cap (gh-ocannl-1649), so a slow
# mirror costs a bounded few minutes rather than the caller's job ceiling:
# `apt-get --download-only` into the cache directory, each attempt a fresh
# apt-get capped at `fetch-attempt-minutes`, keeping what earlier attempts
# finished. The slowness is per apt session -- a slow run's later fetches from
# the same mirror ran at MB/s -- so a fresh attempt is the remedy, not a longer
# wait. The cap bounds slow SESSIONS: a mirror slow for every attempt leaves
# the rest to the install, at the mirror's pace.
#
# The save is an explicit `actions/cache/save` step right after the fill, not
# `actions/cache`'s post step, for two reasons. Run inside `setup-ocaml-debs`
# -- a composite action calling this one -- the post step evaluated its inputs
# empty (`Input required and not supplied: path`) and saved nothing, on every
# job, so every run filled from the mirror. And a post step saves only when
# the whole job succeeds, so a fill that a later failure or cancellation
# followed was lost too. Only a complete fill is saved.
#
# This action does not refresh the apt index; a caller whose packages need a
# current one (a stale image index 404s on superseded versions, gh-ocannl-698)
# runs `apt-get update` first. Every step is best-effort -- a failure warns,
# and the caller's own install does what it always did. So the caller keeps
# its plain `apt-get install` of the same list after this action: on success
# it is a no-op, otherwise it is the fallback.

inputs:
  packages:
    description: Space-separated packages to install.
    required: true
  optional-packages:
    description: >-
      Space-separated packages installed only when the apt index knows them.
    required: false
    default: ''
  key:
    description: >-
      Cache key prefix naming this package set, versioned (e.g. `texlive-debs-v1`).
      Also names the archive directory under $RUNNER_TEMP.
    required: true
  fetch-attempts:
    description: >-
      How many fresh `apt-get --download-only` runs the fill gets before it
      gives up and leaves the rest to the install.
    required: false
    default: '3'
  fetch-attempt-minutes:
    description: >-
      The cap on each of those runs, in minutes (a decimal is fine).
    required: false
    default: '2'

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        REQUIRED: ${{ inputs.packages }}
        OPTIONAL: ${{ inputs.optional-packages }}
      run: |
        dir=$RUNNER_TEMP/$KEY
        mkdir -p "$dir/partial"
        echo "dir=$dir" >>"$GITHUB_OUTPUT"
        # The hosted runner's image name (ubuntu22, ubuntu24): a process
        # variable, so not in the expression `env` context the key reads.
        echo "image=${ImageOS:-unknown}" >>"$GITHUB_OUTPUT"
        optional=
        if [ -n "$OPTIONAL" ]; then
          # The optional packages the index knows.
          optional=$(apt-cache show --no-all-versions $OPTIONAL 2>/dev/null |
            sed -n 's/^Package: //p' | sort -u | tr '\n' ' ') || true
        fi
        packages="$REQUIRED $optional"
        echo "packages=$packages" >>"$GITHUB_OUTPUT"
        if ! uris=$(sudo apt-get --yes -qq --print-uris install $packages); then
          echo "::warning::could not plan the apt packages ($packages); the caller installs them itself"
          exit 0
        fi
        printf '%s\n' "$uris"
        if [ -z "$uris" ]; then
          echo "The apt packages are already installed: $packages"
          exit 0
        fi
        # The archive file names apt will look for, read by the prune below.
        printf '%s\n' "$uris" | awk '{print $2}' >"$dir.files"
        echo "files=$dir.files" >>"$GITHUB_OUTPUT"
        echo "digest=$(printf '%s\n' "$uris" | sort | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
    - id: restore
      if: steps.plan.outputs.digest != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.plan.outputs.dir }}
        key: ${{ inputs.key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.image }}-${{ steps.plan.outputs.digest }}
        restore-keys: ${{ inputs.key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.image }}-
    # The fill, on its own and capped: download into the cache directory, a
    # fresh apt-get per attempt.
    - id: fetch
      if: steps.plan.outputs.digest != ''
      shell: bash
      env:
        DEBS: ${{ steps.plan.outputs.dir }}
        FILES: ${{ steps.plan.outputs.files }}
        PACKAGES: ${{ steps.plan.outputs.packages }}
        ATTEMPTS: ${{ inputs.fetch-attempts }}
        MINUTES: ${{ inputs.fetch-attempt-minutes }}
      run: |
        # Root downloads unsandboxed: the `_apt` user cannot reach a directory
        # under the runner's home. Every attempt keeps what the previous ones
        # finished (whole files, and the partial one apt resumes).
        status=1
        for attempt in $(seq 1 "$ATTEMPTS"); do
          status=0
          sudo timeout --kill-after=30s "${MINUTES}m" apt-get --yes --download-only \
            -o Dir::Cache::Archives="$DEBS" -o APT::Keep-Downloaded-Packages=true \
            -o APT::Sandbox::User=root install $PACKAGES || status=$?
          if [ "$status" -eq 0 ]; then break; fi
          # A stopped apt-get can leave its progress line open, and a workflow
          # command is read only at the start of a line.
          echo
          case $status in
            124 | 137) echo "::warning::fetch attempt $attempt/$ATTEMPTS outlived its ${MINUTES}-minute cap (a slow mirror session); stopped it" ;;
            *) echo "::warning::fetch attempt $attempt/$ATTEMPTS failed with status $status" ;;
          esac
        done
        # The save runs as the runner user.
        sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"
        # Drop what a prefix restore brought that this plan no longer names,
        # so a saved entry holds one package set rather than the union of all.
        for f in "$DEBS"/*.deb; do
          [ -e "$f" ] || continue
          grep -qxF -- "${f##*/}" "$FILES" || { echo "dropping stale ${f##*/}"; rm -f -- "$f"; }
        done
        ls -l "$DEBS"
        if [ "$status" -eq 0 ]; then
          echo "complete=true" >>"$GITHUB_OUTPUT"
        else
          echo "::warning::the cache directory is incomplete, so it is not saved; the install below fetches the rest itself"
        fi
    # Saved here, explicitly, rather than by actions/cache's post step: see the
    # header. Only a complete set: an exact hit is never saved over, so an
    # incomplete entry under the full key would stay incomplete.
    - if: steps.fetch.outputs.complete == 'true' && steps.restore.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.plan.outputs.dir }}
        key: ${{ inputs.key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.image }}-${{ steps.plan.outputs.digest }}
    - if: steps.plan.outputs.digest != ''
      shell: bash
      env:
        DEBS: ${{ steps.plan.outputs.dir }}
        PACKAGES: ${{ steps.plan.outputs.packages }}
      run: |
        # The caller's own command, reading the cache directory; whatever an
        # incomplete fetch left out, it fetches itself (apt needs the
        # `partial` directory the fill removed before its save).
        mkdir -p "$DEBS/partial"
        sudo apt-get --yes -o Dir::Cache::Archives="$DEBS" -o APT::Sandbox::User=root install $PACKAGES ||
          echo "::warning::pre-installing the apt packages from the cache failed; the caller installs them itself"
